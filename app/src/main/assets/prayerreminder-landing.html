<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PrayerReminder – Sanctuary Mosque Edition</title>
<style>
:root{
  color-scheme:dark;
  --bg:#030a0e;
  --teal:#14303c;
  --deep:#0f2430;
  --gold:#ffbf1f;
  --pale:#ffe58a;
  --text:#fff;
  --muted:#8fa3b0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  min-height:100%;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overflow:hidden;
}
body{overflow:hidden}
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 20px 36px;
  position:relative;
  text-align:center;
}
.sky{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(ellipse at 50% 38%,rgba(255,191,31,.0) 0,rgba(255,191,31,0) 60%);
  opacity:0;
}
.go .sky{animation:dawn 3s 1.1s ease-out forwards}
@keyframes dawn{
  to{
    opacity:1;
    background:radial-gradient(ellipse 60% 45% at 50% 38%,rgba(255,191,31,.13),rgba(20,48,60,.25) 45%,rgba(3,10,14,0) 75%);
  }
}
svg{
  width:min(76vw,380px);
  height:auto;
  overflow:visible;
  position:relative;
}
svg *{transform-box:fill-box}
.frame{
  fill:rgba(20,48,60,.35);
  stroke:url(#fg);
  stroke-width:3;
  stroke-dasharray:1;
  stroke-dashoffset:1;
  opacity:0;
}
.go .frame{animation:draw 1.6s .1s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0;opacity:1}}
.glow{opacity:0;transform:scale(.4);transform-origin:center}
.go .glow{animation:glow 2.4s 1s ease-out forwards,breathe 5s 3.6s ease-in-out infinite}
@keyframes glow{to{opacity:1;transform:scale(1)}}
@keyframes breathe{50%{opacity:.7;transform:scale(1.06)}}
.base{opacity:0;transform:scaleX(.2)}
.go .base{animation:grow .8s .8s ease-out forwards}
@keyframes grow{to{opacity:1;transform:scaleX(1)}}
.rise{transform:scaleY(0);transform-origin:50% 100%}
.go .dome{animation:up 1.3s 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.go .min.l{animation:up 1s 1.5s cubic-bezier(.2,.8,.2,1) forwards}
.go .min.r{animation:up 1s 1.7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{transform:scaleY(1)}}
.drop{opacity:0;transform:translateY(-14px)}
.go .drop{animation:drop .7s var(--d,2.4s) ease-out forwards}
@keyframes drop{to{opacity:1;transform:none}}
.crescent{opacity:0;transform:rotate(-50deg) scale(.5);transform-origin:50% 60%}
.go .crescent{animation:moon 1.3s 2.5s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes moon{to{opacity:1;transform:none}}
.star{opacity:0}
.go .star{animation:pop .5s var(--d) ease-out forwards,tw 3s calc(var(--d) + .5s) ease-in-out infinite}
@keyframes pop{from{transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes tw{50%{opacity:.3}}
.win{opacity:0}
.go .win{animation:lit 1.2s 3.2s ease-out forwards,flick 4s 4.6s ease-in-out infinite}
@keyframes lit{0%{opacity:0}30%{opacity:.4}45%{opacity:.2}100%{opacity:1}}
@keyframes flick{50%{opacity:.82}}
.winhalo{opacity:0}
.go .winhalo{animation:lit 1.6s 3.2s ease-out forwards}
h1{
  font-size:clamp(30px,6.8vw,48px);
  font-weight:700;
  letter-spacing:-.01em;
  margin:28px 0 16px;
  display:flex;
  justify-content:center;
  overflow:hidden;
  padding-bottom:.1em;
}
h1 span{display:inline-block;transform:translateY(110%);opacity:0}
.go h1 span{animation:letter .7s calc(3.3s + var(--i)*.045s) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes letter{to{transform:none;opacity:1}}
.edition{
  color:var(--gold);
  font-weight:700;
  font-size:clamp(13px,2.2vw,16px);
  letter-spacing:.18em;
  text-transform:uppercase;
  margin:0 0 16px;
  opacity:0;
  clip-path:inset(0 50% 0 50%);
}
.go .edition{animation:wipe 1s 4.2s ease-out forwards}
@keyframes wipe{to{opacity:1;clip-path:inset(0 0 0 0)}}
.features{
  list-style:none;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px 22px;
  padding:0;
  margin:0;
  color:var(--muted);
  font-size:14px;
}
.features li{opacity:0;transform:translateY(8px)}
.go .features li{animation:drop .7s calc(4.7s + var(--k)*.15s) ease-out forwards}
.features li+li::before{
  content:"";
  display:inline-block;
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--gold);
  margin-right:22px;
  vertical-align:middle;
  opacity:.7;
}
@media(max-width:520px){.features li+li::before{display:none}}
.skip-hint{
  margin-top:28px;
  font-size:12px;
  letter-spacing:.08em;
  color:rgba(255,255,255,.35);
  text-transform:uppercase;
  opacity:0;
}
.go .skip-hint{animation:drop .6s 4.8s ease-out forwards}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .frame{stroke-dashoffset:0;opacity:1}.glow,.base,.drop,.crescent,.star,.win,.winhalo,.edition,.features li,.skip-hint,h1 span,.sky{opacity:1!important;transform:none!important;clip-path:none!important}
  .rise{transform:none}
}
</style>
</head>
<body onclick="handleClick()">
<main class="hero" id="hero">
  <div class="sky"></div>
  <svg viewBox="170 100 460 470" role="img" aria-label="Mosque dome with two minarets, a crescent moon and stars">
    <defs>
      <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a227"/><stop offset=".5" stop-color="#5d6a70"/><stop offset="1" stop-color="#b8962a"/></linearGradient>
      <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffbf1f" stop-opacity=".38"/><stop offset=".6" stop-color="#ffbf1f" stop-opacity=".08"/><stop offset="1" stop-color="#ffbf1f" stop-opacity="0"/></radialGradient>
      <radialGradient id="wh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe58a" stop-opacity=".55"/><stop offset="1" stop-color="#ffe58a" stop-opacity="0"/></radialGradient>
      <mask id="cm"><rect x="380" y="150" width="70" height="70" fill="#fff"/><circle cx="415" cy="181" r="15" fill="#000"/></mask>
    </defs>
    <rect class="frame" x="180" y="108" width="440" height="442" rx="92" pathLength="1"/>
    <ellipse class="glow" cx="400" cy="340" rx="190" ry="170" fill="url(#gl)"/>
    <rect class="base" x="258" y="441" width="284" height="22" fill="#0c1a22"/>
    <g class="rise min l"><rect x="274" y="270" width="16" height="172" fill="#0f2430"/></g>
    <g class="rise min r"><rect x="510" y="270" width="16" height="172" fill="#0f2430"/></g>
    <rect class="drop" style="--d:2.2s" x="270" y="308" width="22" height="7" fill="#ffbf1f"/>
    <rect class="drop" style="--d:2.3s" x="507" y="308" width="22" height="7" fill="#ffbf1f"/>
    <g class="drop" style="--d:2.3s" fill="#ffbf1f"><path d="M274 270L281 243L288 270Z"/><rect x="279" y="221" width="4" height="22"/></g>
    <g class="drop" style="--d:2.4s" fill="#ffbf1f"><path d="M511 270L518 243L526 270Z"/><rect x="516" y="221" width="4" height="22"/></g>
    <g class="rise dome"><path d="M310 441C310 340 360 282 400 243C440 282 490 340 490 441Z" fill="#14303c" stroke="#1f5368" stroke-width="1.5"/></g>
    <circle class="winhalo" cx="400" cy="392" r="46" fill="url(#wh)"/>
    <path class="win" d="M389 411V384A11 11 0 0 1 411 384V411Z" fill="#ffe58a"/>
    <g class="drop" style="--d:2.3s" fill="#ffbf1f"><rect x="396" y="215" width="8" height="28"/><circle cx="400" cy="211" r="7"/></g>
    <g class="crescent"><circle cx="404" cy="185" r="19" fill="#ffbf1f" mask="url(#cm)"/></g>
    <circle class="star" style="--d:3s" cx="348" cy="188" r="3" fill="#fff"/>
    <circle class="star" style="--d:3.2s" cx="329" cy="226" r="3.5" fill="#fff"/>
    <circle class="star" style="--d:3.4s" cx="451" cy="181" r="4" fill="#ffe58a"/>
    <circle class="star" style="--d:3.6s" cx="470" cy="211" r="5" fill="#ffe58a"/>
  </svg>
  <h1 id="title" aria-label="PrayerReminder"></h1>
  <ul class="features">
    <li style="--k:0">100% Offline</li>
    <li style="--k:1">Bhatkal Timetable</li>
    <li style="--k:2">Adhan &amp; Jamaat</li>
  </ul>
  <div class="skip-hint">Tap anywhere to continue</div>
</main>
<script>
(function(){
  var t=document.getElementById('title'),s='PrayerReminder';
  t.innerHTML=s.split('').map(function(c,i){return '<span aria-hidden="true" style="--i:'+i+'">'+c+'</span>'}).join('');
  var h=document.getElementById('hero');
  function play(){h.classList.remove('go');void h.offsetWidth;h.classList.add('go')}
  play();

  // Auto transition to app after animation finishes (~5.8s)
  setTimeout(function(){
    finishIntro();
  }, 5800);
})();

function handleClick() {
  finishIntro();
}

function finishIntro() {
  if (window.Android && typeof window.Android.onFinished === 'function') {
    window.Android.onFinished();
  }
}
</script>
</body>
</html>
